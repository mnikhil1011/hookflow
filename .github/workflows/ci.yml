name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # The integration tests start Postgres, Redis and Kafka in Docker through Testcontainers.
      # GitHub's Ubuntu runners have Docker installed, so no extra setup is needed.
      - name: Build and test
        run: chmod +x mvnw && ./mvnw -B verify
