# Local environment.
#
#   docker compose up -d                          Postgres, Redis and Kafka (run the app yourself)
#   docker compose --profile app up -d --build    the same, plus Hookflow itself in a container
#   docker compose --profile monitoring up -d     adds Prometheus (:9090) and Grafana (:3000)
#   docker compose --profile loadtest up -d       adds the mock receiver (:9000) for demos and load tests

# A fixed project name keeps container and network names the same wherever this folder lives.
name: hookflow

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hookflow
      POSTGRES_USER: hookflow
      POSTGRES_PASSWORD: hookflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookflow -d hookflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: HOST for programs on your machine, DOCKER for other containers.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  app:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hookflow
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Development values. Set real ones outside your own machine.
      HOOKFLOW_ADMIN_TOKEN: dev-admin-token
      HOOKFLOW_ALLOW_INSECURE_URLS: "true"
    extra_hosts:
      # Lets the app reach a mock receiver running on your machine as http://host.docker.internal:9000
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  # Pretends to be customers' webhook endpoints. Inside Docker it is reachable as http://mock-receiver:9000
  mock-receiver:
    profiles: ["loadtest"]
    image: eclipse-temurin:25-jdk
    command: ["java", "/app/MockReceiver.java", "9000"]
    ports:
      - "9000:9000"
    volumes:
      - ./mock-receiver:/app:ro

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      # No login on your own machine. Never do this on a shared server.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres-data:
