spring:
  application:
    name: hookflow
  datasource:
    url: jdbc:postgresql://localhost:5432/hookflow
    username: hookflow
    password: hookflow
    hikari:
      # API requests and delivery workers share this pool. Under load the default of 10 made
      # requests queue for a connection; measure before raising it further.
      maximum-pool-size: 30
      # Fail fast when Postgres is unreachable, so callers get a quick 503 instead of a 30-second hang.
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      # Offsets are committed by Spring after each batch of messages has been processed, never
      # before. A crash mid-batch means some messages are processed twice, but none are skipped.
      enable-auto-commit: false
      auto-offset-reset: earliest
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

hookflow:
  # Required. Protects POST /v1/tenants.
  admin-token: ${HOOKFLOW_ADMIN_TOKEN}
  # When false, endpoint URLs must use https and must not point at private addresses.
  allow-insecure-urls: false
  delivery:
    connect-timeout: 3s
    request-timeout: 10s
    attempt-lease: 60s
    max-in-flight: 500
    retry-delays: [5s, 30s, 2m, 10m, 30m, 1h, 2h]
    retry-jitter: 0.2
  flow-control:
    mode: adaptive
    fixed-limit: 50
    initial-limit: 4
    min-limit: 1
    max-limit: 200
    decrease-factor: 0.5
    decrease-cooldown: 1s
    slot-lease: 30s
    max-pause: 60s
    max-waiting: 10000
  polling:
    interval: 100ms
    batch-size: 500
